<title>Movimentação de estoque</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1b2733;padding-bottom:90px}
.w{max-width:720px;margin:0 auto;padding:12px}h1{font-size:20px;margin:8px 0 12px}
.c{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
label{font-size:13px;font-weight:700;display:block;margin:8px 0 4px}
select,input[type=text],input[type=search],textarea{width:100%;padding:10px;border:1px solid #b9c3cc;border-radius:8px;font-size:16px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1;padding:9px;border:1px solid #b9c3cc;background:#fff;border-radius:8px;font-size:14px}
.tabs button.on{background:#0b5cab;color:#fff;border-color:#0b5cab}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e6eaee}
.it.s{background:#e8f2fc;margin:0 -12px;padding:8px 12px}.nm{flex:1;font-size:14px}
.q{display:flex;align-items:center;gap:4px}.q button{width:34px;height:34px;border:1px solid #b9c3cc;background:#fff;border-radius:8px;font-size:18px}
.q input{width:56px;text-align:center;padding:7px;border:1px solid #b9c3cc;border-radius:8px;font-size:16px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 6px #0003;padding:10px}
#bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
#env{flex:1;padding:13px;border:0;border-radius:8px;background:#0b8a4a;color:#fff;font-size:16px;font-weight:700}
#env:disabled{background:#9aa5af}#msg{font-size:14px;margin:8px 0;white-space:pre-line}.ok{color:#0b8a4a}.er{color:#c0281c}
body{background:#eaf1ea}
header{background:#025320;color:#fff;text-align:center;padding:8px 12px 14px;border-bottom:4px solid #8dc63f}
header img{display:block;margin:0 auto;width:210px;max-width:60%;height:auto}
header h1{font-size:17px;margin:6px 0 0;letter-spacing:.5px;font-weight:600}
.w{padding-top:14px}.c{border-top:3px solid #025320}label{color:#025320}
.tabs{flex-wrap:wrap}.tabs button{flex:1 1 auto;font-size:13px;padding:8px 10px;color:#025320;border-color:#025320}
.tabs button.on{background:#025320;color:#fff;border-color:#025320}
.it.s{background:#e3f1e3}.q button{color:#025320;border-color:#025320}
select:focus,input:focus,textarea:focus{outline:2px solid #8dc63f;border-color:#025320}
#bar{background:#025320}#ct{color:#fff;font-weight:700}
#env{background:#fff;color:#025320}#env:disabled{background:#ffffff55;color:#ffffffaa}
